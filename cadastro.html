<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de cadastro</title>
    <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>
<div id="secao-formulario">
    <h2>Cadastro do Morador</h2>
    <div class="input-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome">
    </div>
    <div class="input-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" maxlength="14">
    </div>
    <div class="input-group">
    <label for="email">E-mail:</label>
    <input type="email" id="email">
  </div>
  <div class="input-group">
    <label for="ano">Ano de Nascimento:</label>
    <input type="number" id="ano">
  </div>
        <div class="input-group">
            <label for="genero">Gênero:</label>
            <input type="radio" name="radgen" id="masc" value="Masculino">
            <label for="masc">Masculino</label>
            <input type="radio" name="radgen" id="fem" value="Feminino">
            <label for="fem">Feminino</label>
            <input type="radio" name="radgen" id="nd" value="nao_declarado">
            <label for="nd">Prefiro não declarar</label>
        </div>
        <div class="input-group">
          <label for="senha">Senha (6 caracteres):</label>
          <div class="password-wrapper">
        <input type="password" id="senha" maxlength="6">
        <button type="button" class="toggle-password" onclick="alternarVisibilidade('senha', this)">👁️</button>
          </div>
        </div>
        <div class="input-group">
          <label for="confirmaSenha">Confirme a Senha:</label>
        <div class="password-wrapper">
        <input type="password" id="confirmaSenha" maxlength="6">
        <button type="button" class="toggle-password" onclick="alternarVisibilidade('confirmaSenha', this)">👁️</button>
        </div>
    </div>
    <button type="button" onclick="Validar()">Validar Dados</button>
</div>

<!-- TELA 2: CONFIRMAÇÃO DE DADOS (Inicia oculta) -->
<div id="secao-confirmacao" style="display: none;">
  <h2>Confirme seus Dados</h2>
  <div id="resumo-dados"></div>

  <div class="botoes-confirmacao">
    <button type="button" onclick="corrigirCadastro()">Refazer Cadastro</button>
    <button type="button" onclick="confirmarCadastroFinal()">Confirmar Cadastro</button>
  </div>
</div>

    <script src="scriptcadastro.js"></script>
    
</body>
</html>
