<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

<body>
  <header class="header-container">

      <form class="login-form">
      <div class="input-group">
        <label for="username">e-mail</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-entrar">Entrar</button>
       <div style="margin-top: 15px; text-align: center;">
    <a href="#" id="btnEsqueciSenha" style="font-size: 0.9rem; color: #007bff; text-decoration: none;">Esqueci minha senha</a>
  </div>
      </form>
      <div class="signup-row">
        <span>Não tem cadastro?</span>
        <a href="cadastro.html" class="btn-cadastrar">Cadastrar-se</a>
      </div>
    </div>
  </header>
  <nav class="nav-bar" aria-label="Menu principal">
    <ul class="menu-list">
      <li><a href="inicio.html">Início</a></li>
      <li><a href="institucional.html">Sobre nós</a></li>

      <li><a href="projetos.html">Projetos</a></li>
      <li><a href="noticias.html">Notícias</a></li>
      </ul>
  </nav>
  <main>
    <section class="hero-section">
      <h1>Bem-vindo ao nosso conselho</h1>
      <p>
        Um espaço de participação e diálogo
        para a comunidade.
      </p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scriptinicial.js" defer></script>
</body>
</html>
